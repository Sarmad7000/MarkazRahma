<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { margin: 0; font-family: Georgia, serif; background: #f4f7f8; color: #1f2933; }
    main { max-width: 420px; margin: 0 auto; padding: 20px 16px 40px; }
    h1 { font-size: 28px; margin: 0 0 8px; }
    p { color: #52606d; }
    input { width: 100%; box-sizing: border-box; font-size: 18px; padding: 12px; border: 1px solid #cbd2d9; border-radius: 12px; }
    button { width: 100%; margin-top: 10px; min-height: 48px; border: 0; border-radius: 12px; background: #0e7490; color: white; font-size: 18px; }
    #reader { margin-top: 16px; border-radius: 16px; overflow: hidden; background: #fff; }
    .card { margin-top: 16px; padding: 16px; border-radius: 16px; background: #fff; }
    .ok { background: #e3f9e5; }
    .bad { background: #ffe3e3; }
    .name { font-size: 28px; margin: 0; }
    .list { font-size: 18px; font-weight: bold; letter-spacing: 0.04em; }
    .day { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-top: 1px solid #e4e7eb; }
    .validated { color: #147d64; }
    .open { color: #627d98; }
    .not-attending { color: #9aa5b1; }
  </style>
</head>
<body>
  <main>
    <h1>Door scanner</h1>
    <p>This Google page cannot use the phone camera. Open the door scanner at markazrahma.org/door.html, tap Start camera, and allow access when the phone asks.</p>
    <label>Door PIN<input id="pin" type="password" autocomplete="current-password" enterkeyhint="go"></label>
    <button type="button" id="unlock">Unlock scanner</button>
    <div id="tools" hidden>
      <div id="reader"></div>
      <label>Or type a code<input id="manual" type="text" autocapitalize="characters"></label>
      <button type="button" id="manual-go">Check typed code</button>
    </div>
    <div id="result"></div>
  </main>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script>
    var busy = false;
    var scanner = null;
    document.getElementById('pin').addEventListener('keydown', function(event) {
      if (event.key === 'Enter') unlock();
    });
    document.getElementById('unlock').onclick = unlock;
    document.getElementById('manual-go').onclick = function() {
      onScan(document.getElementById('manual').value);
    };

    function unlock() {
      var pin = document.getElementById('pin').value.trim();
      if (!pin) {
        show({ ok: false, message: 'Type the door PIN, then tap Unlock scanner.' });
        return;
      }
      document.getElementById('unlock').disabled = true;
      google.script.run
        .withSuccessHandler(function(response) {
          document.getElementById('unlock').disabled = false;
          show(response);
          if (!response.ok) return;
          document.getElementById('tools').hidden = false;
          startCamera();
        })
        .withFailureHandler(function(err) {
          document.getElementById('unlock').disabled = false;
          show({ ok: false, message: err.message || 'The scanner could not reach the sheet.' });
        })
        .checkPin(pin);
    }

    function startCamera() {
      if (scanner || typeof Html5Qrcode !== 'function') {
        if (typeof Html5Qrcode !== 'function') {
          show({ ok: false, message: 'The camera could not start. Type the ticket code instead.' });
        }
        return;
      }
      scanner = new Html5Qrcode('reader');
      scanner.start({ facingMode: 'environment' }, { fps: 8, qrbox: 220 }, onScan).catch(function() {
        show({ ok: false, message: 'Allow the camera, or type the ticket code below.' });
      });
    }

    function onScan(raw) {
      if (busy) return;
      var code = extractCode(raw);
      if (!code) return;
      busy = true;
      google.script.run
        .withSuccessHandler(show)
        .withFailureHandler(function(err) { busy = false; show({ ok: false, message: err.message || 'The scanner could not reach the sheet.' }); })
        .scanTicket(code, document.getElementById('pin').value);
    }

    function extractCode(raw) {
      var text = String(raw || '').trim();
      var match = text.match(/[?&]ticket=([^&]+)/);
      if (match) return decodeURIComponent(match[1]);
      return text;
    }

    function show(response) {
      busy = false;
      var box = document.getElementById('result');
      var ticket = response.ticket;
      var days = ticket ? ticket.days.map(function(day) {
        var state = day.state === 'validated' ? 'Validated' : day.state === 'open' ? 'Not yet' : 'Not attending';
        return '<div class="day"><span>Day ' + day.n + '/3</span><span class="' + day.state + '">' + state + '</span></div>';
      }).join('') : '';
      box.innerHTML = '<div class="card ' + (response.ok ? 'ok' : 'bad') + '">'
        + '<p class="name">' + escapeHtml(response.message || '') + '</p>'
        + (ticket ? '<p class="list">' + escapeHtml(ticket.list) + '</p><p>' + escapeHtml(ticket.name) + '</p>' + days : '')
        + '</div>';
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, function(ch) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch];
      });
    }
  </script>
</body>
</html>
