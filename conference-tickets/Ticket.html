<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { margin: 0; font-family: Georgia, serif; background: #f7f4ef; color: #1f2933; }
    main { max-width: 420px; margin: 0 auto; padding: 28px 18px 48px; text-align: center; }
    h1 { font-size: 30px; line-height: 1.15; margin-bottom: 8px; }
    .muted { color: #52606d; }
    canvas { width: 240px; height: 240px; margin: 18px auto; background: white; border-radius: 16px; }
    .day { display: flex; justify-content: space-between; text-align: left; padding: 10px 0; border-top: 1px solid #e4e7eb; }
    .validated { color: #147d64; font-weight: bold; }
    .open { color: #627d98; }
    .not-attending { color: #9aa5b1; }
    .missing { color: #9b1c1c; }
  </style>
</head>
<body>
  <main id="app"></main>
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
  <script>
    var payload = <?!= payload ?>;
    var app = document.getElementById('app');
    if (!payload.ok) {
      app.innerHTML = '<p class="missing">' + escapeHtml(payload.message) + '</p>';
    } else {
      var ticket = payload.ticket;
      app.innerHTML = '<p class="muted">Markaz Al-Rahma</p>'
        + '<h1>Building Sound Foundations in Islam</h1>'
        + '<p>6–8 November 2026<br>Cavendish Banqueting Hall</p>'
        + '<p><strong>' + escapeHtml(ticket.name) + '</strong><br>' + escapeHtml(ticket.list) + '</p>'
        + '<canvas id="qr"></canvas>'
        + ticket.days.map(function(day) {
          var state = day.state === 'validated' ? 'Validated' : day.state === 'open' ? 'Not yet' : 'Not attending';
          return '<div class="day"><span>Day ' + day.n + '/3<br><span class="muted">' + escapeHtml(day.when) + '</span></span><span class="' + day.state + '">' + state + '</span></div>';
        }).join('')
        + '<p class="muted">Show this QR code at the door. It can be scanned once each day you are attending.</p>';
      QRCode.toCanvas(document.getElementById('qr'), window.location.href, { width: 240, margin: 1 });
    }
    function escapeHtml(value) {
      return String(value || '').replace(/[&<>"']/g, function(ch) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch];
      });
    }
  </script>
</body>
</html>
